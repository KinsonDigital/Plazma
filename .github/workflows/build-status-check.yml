name: ✅Build Status Check
run-name: ✅Build Status Check (${{ github.base_ref }} branch)


defaults:
  run:
    shell: pwsh


on:
  workflow_dispatch: 
  pull_request_target:
    branches: [main, preview]


jobs:
  build_main_project:
    name: Build Main Project
    uses: KinsonDigital/Infrastructure/.github/workflows/build-csharp-project.yml@v15.0.0
    with:
      project-name: "${{ vars.PROJECT_NAME }}"
      build-config: Debug
      net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
      checkout-ref: ${{ github.event.pull_request.head.ref }}
      checkout-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      cicd-pat: ${{ secrets.CICD_TOKEN }}


  build_testing_project:
    name: Build Testing Project
    uses: KinsonDigital/Infrastructure/.github/workflows/build-csharp-project.yml@v15.0.0
    with:
      project-name: "${{ vars.PROJECT_NAME }}Testing"
      build-config: Debug
      net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
      checkout-ref: ${{ github.event.pull_request.head.ref }}
      checkout-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      cicd-pat: ${{ secrets.CICD_TOKEN }}


  build_random_perf_app:
    name: Build Random Perf Project
    uses: KinsonDigital/Infrastructure/.github/workflows/build-csharp-project.yml@v15.0.0
    with:
      project-name: "RandomPerf"
      build-config: Debug
      net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
      checkout-ref: ${{ github.event.pull_request.head.ref }}
      checkout-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      cicd-pat: ${{ secrets.CICD_TOKEN }}


  build_engine_perf_app:
    name: Build Engine Perf Project
    uses: KinsonDigital/Infrastructure/.github/workflows/build-csharp-project.yml@v15.0.0
    with:
      project-name: "EnginePerf"
      build-config: Debug
      net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
      checkout-ref: ${{ github.event.pull_request.head.ref }}
      checkout-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      cicd-pat: ${{ secrets.CICD_TOKEN }}


  build_status_check:
    name: ${{ vars.PROJECT_NAME }} Build Status Check
    needs: [build_main_project, build_testing_project, build_random_perf_app, build_engine_perf_app]
    runs-on: ubuntu-latest
    steps:
      - name: Print Success Message
        run: Write-Host "Build Status Check Passed!"
